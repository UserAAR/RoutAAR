name: Bug report
description: Create a report to help us improve
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide a minimal, complete, and verifiable example.
      placeholder: 1) Go to ... 2) Click ... 3) Observe ...
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Affected URL (if applicable)
      placeholder: https://rout.aars.works/...
  - type: input
    id: version
    attributes:
      label: App version / commit
      placeholder: v3.x / commit SHA
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Logs, screenshots, or any other relevant information. 